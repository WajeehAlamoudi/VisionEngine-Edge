# ── BoT-SORT tracker configuration ──────────────────────────────────────────
#
# Referenced from models.yaml via the "tracker:" field, e.g.:
#   tracker: "config/botsort_tracker.yaml"
#
# Read only by the ultralytics runtime. A model on runtime: deepstream
# points "tracker:" at an nvtracker config instead, where the file also
# decides which algorithm runs — see config_sample/nvdcf_tracker.sample.yml.
#
# Naming convention for tracker config files: "<algorithm>_tracker.yaml"
# (e.g. a future ByteTrack config would be "bytetrack_tracker.yaml").
# Add a new one the same way if a new tracker backend is registered in
# core/model/tracker/registry.py.
#
# These are real, literal values passed straight into boxmot's BotSort
# class. This is NOT the same file as boxmot's own bundled botsort.yaml —
# that one is a hyperparameter search-space definition for its internal
# auto-tuning engine (ranges, not values) and cannot be loaded directly.
#
# WHAT MAY GO IN THIS FILE
# Every key here is expanded into BotSort(**params), except the four reid_*
# keys at the bottom, which this project consumes to build the ReID model.
# So any BotSort constructor argument is valid. The full set:
#
#   with_reid  track_high_thresh  track_low_thresh  new_track_thresh
#   track_buffer  match_thresh  proximity_thresh  appearance_thresh
#   use_cmc  cmc_method  frame_rate  fuse_first_associate
#   second_match_thresh  unconfirmed_match_thresh  unconfirmed_emb_scale
#   removed_stracks_buffer
#
# CAUTION — keys that look valid but do nothing.
# BotSort accepts **kwargs, so det_thresh, max_age, min_hits, iou_threshold,
# asso_func and per_class are absorbed and echoed in the startup log while
# BotSort never reads them; they belong to other boxmot trackers. A typo is
# swallowed the same way. This file is not validated by the strict config
# loader, so check the "BotSort: ..." startup log line to confirm a value
# actually arrived.

# Match objects by appearance (what they look like), not just position.
# Turn this on to recover identity across occlusion or low camera frame
# rate — the two biggest causes of a track_id changing when it shouldn't.
with_reid: true

# Camera-motion compensation — corrects for the *camera itself* moving or
# shaking between frames. Leave false for a fixed/static camera; only
# turn on for a handheld or pan-tilt-zoom camera.
use_cmc: false

# Set this to the camera's real, MEASURED frames-per-second — not the
# fps_target from cameras.yaml, which is only a ceiling. Read it from the
# per-camera throughput line the pipeline logs every 10 seconds.
#
# It scales the track buffer and nothing else, so the two are read together:
#   seconds a lost track is remembered = track_buffer / 30
# A stale frame_rate silently changes that window. At frame_rate 4 while
# actually running at 12 fps, a 4-second buffer becomes 12 seconds, and a
# track abandoned long ago can be revived onto a different person.
frame_rate: 5

# See above — this divided by 30 is the memory window in seconds.
# 120 = 4 seconds. The default of 30 = 1 second, which is usually too short
# for anyone briefly walking behind an obstacle.
track_buffer: 120

# Minimum box overlap (IoU) required to accept a match between a new
# detection and a track's predicted position. Lower = more lenient
# matching (fewer new IDs created, but higher risk of mismatches).
match_thresh: 0.8

# Minimum detection confidence required to start a brand-new track.
new_track_thresh: 0.6

# Confidence threshold for the primary (high-confidence) matching pass.
track_high_thresh: 0.6

# Confidence threshold for the secondary (low-confidence) matching pass —
# catches partially-occluded or blurry detections the first pass missed.
#
# This pass only sees detections BELOW track_high_thresh, so it is starved
# when models.yaml sets a high confidence_threshold: a model floor of 0.5
# leaves only the 0.5–0.6 band instead of 0.1–0.6.
track_low_thresh: 0.1

# IoU gate applied before appearance matching is attempted. A pair whose
# boxes overlap less than (1 - this) is rejected outright, so at a low frame
# rate — where a walking person moves far between frames — ReID never gets
# the chance to rescue the match. 0.7 allows overlap down to 30%.
proximity_thresh: 0.7

# Maximum embedding distance accepted as the same identity. Raising it makes
# ReID more permissive and risks merging two similar-looking people.
appearance_thresh: 0.25

# Use appearance in the FIRST association pass, not only the second. Worth
# enabling when large inter-frame motion makes IoU alone unreliable.
fuse_first_associate: true

# Camera-motion estimation algorithm. Read only when use_cmc: true, so it is
# inert above — stated anyway so nothing in this file is left to a default.
cmc_method: ecc

# Matching threshold for the second association pass, the one that works on
# low-confidence detections. Looser than match_thresh because those boxes are
# already the weaker evidence.
second_match_thresh: 0.5

# Matching threshold for a track that is new and not yet confirmed. Its first
# association is the most fragile, since there is no motion history to predict
# from — loosening this can help a person keep the id they were first given.
unconfirmed_match_thresh: 0.7

# How much appearance is weighted for those unconfirmed tracks, relative to
# motion. Higher means lean harder on ReID while the Kalman filter has nothing
# to say yet.
unconfirmed_emb_scale: 2.0

# How many removed tracks are remembered, to avoid immediately reissuing an id
# that was just retired.
removed_stracks_buffer: 100


# ── ReID model ───────────────────────────────────────────────────────────────
# Read only when with_reid: true. These four are consumed by this project
# rather than passed to BotSort, which expects a constructed model object.

# pytorch  — the .pt checkpoint through torch. Works anywhere torch does.
# tensorrt — a .engine built for THIS device. Far faster: OSNet is small
#            enough that its cost is kernel launch overhead rather than
#            arithmetic, so layer fusion helps enormously while half
#            precision alone does not.
#
# Only these two are selectable. boxmot's other backends (onnx, openvino,
# tflite) pip install their runtime on first load, which replaces a vendor
# torch build on devices whose CUDA stack comes from the OS rather than pip.
# Selecting one raises at startup instead.
reid_backend: pytorch

# A TORCH device, which is not necessarily the model's accelerator.
#   auto → follow models.yaml accelerator when it names a torch device,
#          else cpu
#   cpu | cuda | mps
# A CoreML model still needs its ReID on cpu or cuda: coreml is not a torch
# device, and reusing it here used to raise at model load.
reid_device: auto

# FP16 for the ReID network. Applied only when reid_device resolves to cuda;
# on cpu/mps it is a logged no-op. Has no effect on a .engine, whose
# precision is fixed when the engine is built.
reid_half: true

# For reid_backend: pytorch  — a checkpoint name boxmot resolves against its
#   own model directory, downloading on first use.
# For reid_backend: tensorrt — the FULL PATH to a .engine built on this
#   device. Export it with the batch dimension dynamic, since one crop is
#   embedded per detection and a frame with three people arrives as a batch
#   of three; a fixed batch-1 engine fails the moment a second person
#   appears.
reid_weights: "osnet_x0_25_msmt17.pt"
