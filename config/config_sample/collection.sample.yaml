collection:
  # ── what collection does ────────────────────────────────────────────────────
  # Collection is a dataset-building tool that runs alongside the main pipeline.
  # It samples and saves camera frames to local disk based on filters you define.
  #
  # Use cases:
  #   - Build a labeled dataset for fine-tuning a YOLO model on a specific site
  #   - Capture edge cases (low confidence, rare classes) for manual review
  #   - Audit model performance in specific zones at specific times
  #   - Collect frames for a new class the model does not yet detect
  #
  # Collection does NOT affect the main detection pipeline.
  # It runs as a parallel observer — frames are shared from the camera stream,
  # not captured separately. No additional camera load.
  #
  # Run modes:
  #   Alongside the main pipeline:   python main.py   (collection runs if enabled: true)
  #   Standalone CLI (no ingest):    python collect.py --session <session_id>
  #
  # Output structure per session:
  #   ./collected/<session_id>/
  #       2026-06-22_08-14-33_cam01.jpg           annotated frame (with bounding boxes)
  #       2026-06-22_08-14-33_cam01_raw.jpg       clean frame (no annotations)
  #       2026-06-22_08-14-33_cam01.json          detection metadata sidecar
  #
  # JSON sidecar format:
  # {
  #   "session":   "entrance-morning",
  #   "camera":    "cam-01",
  #   "ts":        "2026-06-22T08:14:33Z",
  #   "detections": [
  #     { "class": "person", "confidence": 0.91, "bbox": [x,y,w,h], "zone": "entrance" }
  #   ]
  # }


  # ── structure ───────────────────────────────────────────────────────────────
  # output_dir  Root folder where all session subfolders are created.
  #             Use a persistent path — not /tmp.
  #
  # sessions    List of collection jobs. An empty list [] means no collection,
  #             and so does an entirely empty collection.yaml — this is the one
  #             file allowed to be blank, because collection is optional.
  #
  # Session fields:
  #
  #   id            Unique name, used as the subfolder under output_dir.
  #                 Letters, digits, hyphens, underscores.
  #
  #   camera        Camera id to collect from. Must match an id in cameras.yaml.
  #
  #   enabled       true → runs when the device starts (or collect.py is called)
  #
  #   schedule      Time window. All four keys are required; use null for "no limit".
  #     after       Only collect after this time of day. "HH:MM" (24-hour) or null.
  #     before      Only collect before this time of day. Must be later than after.
  #     start_date  Do not collect before this date. "YYYY-MM-DD" or null.
  #     end_date    Stop after this date, inclusive. Must not precede start_date.
  #
  #   sampling      How often a frame is saved.
  #     mode              interval     → one frame every interval_seconds
  #                       on_detection → only when a qualifying detection occurs
  #                       random       → frames_per_minute at random intervals
  #     interval_seconds  Required when mode is "interval", otherwise null.
  #     frames_per_minute Required when mode is "random", otherwise null.
  #
  #   filters       Conditions a frame must meet before being saved.
  #     classes         "*" for any class, or a list. An empty list [] is rejected.
  #                     Every listed class must be active on that camera.
  #     min_confidence  0.0 – 1.0.
  #     min_detections  Minimum qualifying detections in the frame. 0 = no minimum.
  #
  #   save          What to write per saved frame. At least one must be true,
  #                 otherwise the session would write nothing.
  #     annotated   frame with bounding boxes and labels drawn on it
  #     raw         clean frame, no annotations
  #     metadata    JSON sidecar with detection details
  #
  #   max_frames    Stop after saving this many frames. 0 = unlimited.


  output_dir: "./collected"

  sessions: []

  # ── example: person detections at the entrance, mornings for one week ───────
  # sessions:
  #   - id: entrance-morning
  #     camera: cam-01
  #     enabled: true
  #     schedule:
  #       after: "08:00"
  #       before: "10:30"
  #       start_date: "2026-07-01"
  #       end_date: "2026-07-07"
  #     sampling:
  #       mode: on_detection
  #       interval_seconds:
  #       frames_per_minute:
  #     filters:
  #       classes: [person]
  #       min_confidence: 0.75
  #       min_detections: 1
  #     save:
  #       annotated: true
  #       raw: true
  #       metadata: true
  #     max_frames: 500
  #
  # ── example: random sampling all day, clean frames for a labelling tool ─────
  #   - id: parking-general
  #     camera: cam-02
  #     enabled: true
  #     schedule:
  #       after:
  #       before:
  #       start_date:
  #       end_date:
  #     sampling:
  #       mode: random
  #       interval_seconds:
  #       frames_per_minute: 2
  #     filters:
  #       classes: [car, truck]
  #       min_confidence: 0.60
  #       min_detections: 0
  #     save:
  #       annotated: false
  #       raw: true
  #       metadata: true
  #     max_frames: 0
