# ByteTrack association for the Ultralytics runtime.
#
# Copy to config/bytetrack_tracker.yaml and point a model's `tracker:` field at
# it while keeping `use_tracker: true`. ByteTrack assigns track IDs from motion
# and bounding-box association; it does not load or run a ReID network.

algorithm: bytetrack

# Detections below this confidence are discarded by the tracker. The detector's
# own confidence_threshold is applied first, so this cannot restore detections
# that YOLO already removed.
min_conf: 0.2

# High-confidence detections can start and update tracks. Lower-confidence
# detections above min_conf can still recover an existing track.
track_thresh: 0.5

# Association threshold between detections and predicted tracks.
match_thresh: 0.8

# Lost-track retention. At the measured 12 fps, 75 corresponds to roughly the
# same 2.5-second window as ByteTrack's default 25 at 30 fps.
track_buffer: 75
frame_rate: 12
