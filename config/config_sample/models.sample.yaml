models:
  # ── model registry ──────────────────────────────────────────────────────────
  # Defines every model available on this device.
  # Cameras in cameras.yaml reference a model by its id.
  #
  # This file is the single source of truth for what each model can detect.
  # It does NOT define which camera uses which model — that is in cameras.yaml.
  # It does NOT define which classes to watch per camera — that is in cameras.yaml.
  #
  # Separation rule:
  #   models.yaml  → what the model IS CAPABLE of detecting (its full class list)
  #   cameras.yaml → what THIS CAMERA should actually watch (a subset filter)
  #
  # At startup the pipeline validates:
  #   - Every camera's model_id exists in this file
  #   - Every class listed on a camera exists in that model's classes list
  #   - A mismatch causes a clear startup error and the device will not run
  #     Example: "cam-02 lists class 'hardhat' but model 'vehicle_detector'
  #               only knows: car, truck, bus, motorcycle, bicycle"
  #
  # Fields:
  #
  #   id          Unique model identifier. Referenced by cameras.yaml.
  #               Convention: descriptive lowercase with underscores.
  #               Example: person_detector, vehicle_detector, general_coco
  #
  #   name        Human-readable label for logs and health reports.
  #
  #   version     Model version string. Shown in health reports so you can
  #               track which version is deployed on each device from the dashboard.
  #               Increment this when you retrain or update weights.
  #
  #   path        Path to the model weights file.
  #               Relative to the project root, or absolute.
  #               Convention: store all model files in ./models/
  #
  #               Which formats are loadable depends on the runtime AND the
  #               accelerator, and the pairing is enforced at startup:
  #                 .pt          PyTorch      → auto | cpu | cuda | mps
  #                 .onnx        ONNX         → ultralytics: auto|cpu|cuda|mps
  #                                             deepstream:  cuda
  #                 .engine      TensorRT     → ultralytics: cuda
  #                                             deepstream:  cuda
  #                 .tflite      TF Lite      → cpu
  #                 .mlpackage   CoreML       → coreml
  #
  #               .engine excludes "auto" on purpose: auto resolves to CPU when
  #               no GPU is present, and a TensorRT engine cannot load on CPU.
  #               A .engine is also built for the exact GPU and TensorRT version
  #               it was exported on — export it on the device that will run it.
  #
  #   runtime     Which code path runs this model. This is the single choice
  #               that decides everything else about how it executes.
  #
  #               A runtime is a matched pair: how frames are captured, and how
  #               the model runs on them. Each is built for the other, so the
  #               capture is the one that suits that inference path rather than
  #               a shared default.
  #
  #               ultralytics → OpenCV capture feeding an Ultralytics/torch
  #                             model. Frames are decoded to host memory, which
  #                             is what that model wants anyway. Runs on any of
  #                             the accelerators below.
  #               deepstream  → NVIDIA DeepStream. The camera is read by NVDEC
  #                             and stays in GPU memory through nvinfer and,
  #                             when use_tracker is on, nvtracker — one
  #                             GStreamer pipeline, no copy to host. NVIDIA
  #                             hardware only, and needs the DeepStream SDK
  #                             plus the pyds bindings. See "runtime:
  #                             deepstream" below.
  #
  #               One limit worth knowing before binding a camera: the
  #               deepstream runtime reads URIs through NVDEC and cannot
  #               open a USB device index. A camera whose source is a bare
  #               integer needs runtime: ultralytics. RTSP, HTTP and file
  #               sources work on both.
  #
  #   accelerator The hardware the runtime executes on.
  #               auto     → detect best available at startup (recommended)
  #               cpu      → force CPU (slowest, works everywhere)
  #               cuda     → NVIDIA GPU (Jetson, desktop GPU)
  #               coreml   → Apple Neural Engine (Mac Mini M-series)
  #               mps      → Apple Metal (Mac Mini M-series, PyTorch)
  #
  #               Not every pairing is valid: the deepstream runtime only runs
  #               on cuda, and a weight format has to suit both. Both are
  #               checked at startup.
  #
  #               These two keys replaced a single `device` key that named the
  #               hardware for some values (cpu/cuda/mps) and the runtime for
  #               others (coreml/deepstream). An old config gets an error at
  #               startup naming the replacement for its value.
  #
  #   classes     The classes this deployment expects from this model. Names
  #               must match exactly what the model outputs, and cameras may
  #               only reference classes listed here.
  #
  #               This is normally a narrowed set, not the model's full 80-class
  #               COCO list — declare the classes you actually use. Treat it as
  #               a contract: if someone deploys the wrong weights file, the
  #               declared classes will not match and startup fails.
  #
  #               Required, non-empty, no duplicates. "*" is NOT accepted here:
  #               this list is the source of truth that camera class filters are
  #               validated against, and resolving "*" would mean loading the
  #               model before the config could be checked.
  #
  #               For standard YOLOv8 / YOLO11 pretrained on COCO 80 classes:
  #                 person, bicycle, car, motorcycle, airplane, bus, train, truck,
  #                 boat, chair, bottle, cup, laptop, cell phone, and 66 more.
  #                 Full list: https://github.com/ultralytics/ultralytics/blob/main/ultralytics/cfg/datasets/coco.yaml
  #
  #               For custom fine-tuned models: use your training config class names.
  #
  #   confidence_threshold
  #               Discard detections below this score. Range 0.0 – 1.0.
  #               This is the model-level floor — rules in rules.yaml can set
  #               a HIGHER threshold per rule via min_confidence.
  #               Cameras cannot override this — use a rule scoped to that
  #               camera instead.
  #
  #   iou_threshold
  #               Intersection over Union for Non-Maximum Suppression.
  #               Removes duplicate bounding boxes for the same object.
  #               Range 0.0 – 1.0. Lower = more aggressive deduplication.
  #               Recommended: 0.45. Rarely needs changing.
  #
  #   input_size  [width, height] in pixels. Frame is resized to this before inference.
  #               Must match what the model was trained with.
  #               Standard YOLO sizes: [320,320] (fast), [640,640] (balanced), [1280,1280] (accurate)
  #
  #   use_tracker The switch for tracking, and it means the same thing on every
  #               runtime — what changes is which tracker it turns on. On
  #               deepstream it decides whether an nvtracker element is built
  #               into the pipeline at all; false there means detection only,
  #               with NvDCF never running and track_id null, exactly as on any
  #               other device.
  #
  #               true  → tracker enabled — track_id is populated per object,
  #                        letting you follow the same object across frames for dwell,
  #                        trajectory, and re-identification analytics in SQL.
  #                        Each camera using this model gets its own dedicated model
  #                        instance (tracker state cannot be shared between cameras).
  #               false → stateless predict — track_id is always null (default).
  #                        Cameras sharing this model_id share one model instance (RAM efficient).
  #
  #   tracker     PATH to the tracker parameters file, relative to the project
  #               root — e.g. "config/botsort_tracker.yaml". This is a file
  #               path, NOT an algorithm name: its contents are passed straight
  #               into the BoT-SORT tracker (with_reid, frame_rate, thresholds).
  #               Copy config/config_sample/botsort_tracker.sample.yaml and tune
  #               it per device.
  #
  #               On every device except deepstream, BoT-SORT is the only
  #               algorithm implemented — see core/model/tracker/registry.py.
  #               There is no way to select ByteTrack; naming a different file
  #               changes the parameters, never the algorithm.
  #
  #               On runtime: deepstream this field means something slightly
  #               different — it is nvtracker's config, and it DOES choose the
  #               algorithm. Point it at one of DeepStream's own files:
  #                 config_tracker_IOU.yml           cheapest, weak through occlusion
  #                 config_tracker_NvSORT.yml        light Kalman tracker
  #                 config_tracker_NvDCF_perf.yml    balanced — start here
  #                 config_tracker_NvDCF_accuracy.yml
  #                 config_tracker_NvDeepSORT.yml    strongest, runs a ReID network
  #               They are installed at /opt/nvidia/deepstream/deepstream/
  #               samples/configs/deepstream-app/. Swapping tracker algorithms
  #               is exactly this one line.
  #
  #               The file must exist when use_tracker: true, on any runtime. A
  #               missing file used to fall back silently to ReID-disabled
  #               defaults, which produced tracking that ran but re-assigned
  #               IDs constantly.
  #
  #   ds_infer_config
  #               nvinfer's configuration file. REQUIRED for runtime: deepstream,
  #               ignored (with a warning) on every other runtime.
  #
  #               This is where the network itself is described — input shape,
  #               class count, precision, clustering — none of which map onto
  #               the fields above. Copy
  #               config/config_sample/deepstream_infer.sample.txt and edit it.
  #
  #               `path` above still names the engine and overrides whatever
  #               model-engine-file this file contains, so models.yaml stays
  #               the single source of truth for which weights are running.
  #
  #   half        FP16 inference — true = run the model at half precision.
  #               Only takes effect when device resolves to cuda (a real GPU);
  #               on cpu/mps it's silently ignored since it gives no speedup
  #               there (sometimes even slower). On a supported GPU (e.g.
  #               Jetson Orin), roughly halves inference time with negligible
  #               accuracy loss. Has no effect on a TensorRT .engine file —
  #               its precision is already fixed at export time.
  #               Default: false.


  # ── model 1: general purpose — full COCO pretrained ─────────────────────────
  # Use this for most deployments. Detects people, vehicles, and common objects.
  # No fine-tuning — straight pretrained weights.

  - id: general_coco
    name: "YOLOv8 General COCO"
    version: "1.0.0"
    path: "./models/yolov8n.pt"
    runtime: ultralytics
    accelerator: auto
    classes:
      - person
      - bicycle
      - car
      - motorcycle
      - bus
      - truck
    confidence_threshold: 0.5
    iou_threshold: 0.45
    input_size: [640, 640]
    use_tracker: false
    tracker: "config/botsort_tracker.yaml"
    half: false


  # ── model 2: person-only fine-tuned ─────────────────────────────────────────
  # Fine-tuned on mall/indoor environments for person detection only.
  # Higher accuracy than general model for this specific use case.

  - id: person_detector
    name: "Person Detector — Mall Fine-Tuned"
    version: "1.0.0"
    path: "./models/person_mall_v1.pt"
    runtime: ultralytics
    accelerator: auto
    classes:
      - person
    confidence_threshold: 0.6
    iou_threshold: 0.45
    input_size: [640, 640]
    use_tracker: false
    tracker: "config/botsort_tracker.yaml"
    half: false


  # ── model 3: vehicle-only ────────────────────────────────────────────────────
  # Optimised for outdoor parking and road scenes.

  - id: vehicle_detector
    name: "Vehicle Detector"
    version: "1.0.0"
    path: "./models/vehicle_v1.pt"
    runtime: ultralytics
    accelerator: auto
    classes:
      - car
      - truck
      - bus
      - motorcycle
      - bicycle
    confidence_threshold: 0.55
    iou_threshold: 0.45
    input_size: [640, 640]
    use_tracker: false
    tracker: "config/botsort_tracker.yaml"
    half: false


  # ── model 4: CoreML compiled (Mac Mini M-series) ────────────────────────────
  # Same weights as general_coco but exported to CoreML for the Apple Neural
  # Engine. The .mlpackage's execution target is fixed at export time, so
  # half: is always ignored here (see UltralyticsDetector.infer).

  - id: general_coco_coreml
    name: "YOLOv8 General COCO — CoreML"
    version: "1.0.0"
    path: "./models/yolov8n.mlpackage"
    runtime: ultralytics
    accelerator: coreml
    classes:
      - person
      - bicycle
      - car
      - motorcycle
      - bus
      - truck
    confidence_threshold: 0.5
    iou_threshold: 0.45
    input_size: [640, 640]
    use_tracker: false
    tracker: "config/botsort_tracker.yaml"
    half: false


  # ── model 5: NVIDIA PeopleNet via DeepStream (Jetson) ───────────────────────
  # NVIDIA's people-specific detector, run through the DeepStream SDK rather
  # than Ultralytics. Detection (nvinfer) and tracking (nvtracker) happen in one
  # GStreamer pipeline on the same GPU buffers, so this entry produces track_id
  # without any BoT-SORT tracker being built.
  #
  # Better than COCO YOLO on crowds, partial occlusion and overhead camera
  # angles, which is the reason to use it. Detects person, bag and face; narrow
  # `classes` and the camera's own filter to whichever you actually need.
  #
  # Requires: a Jetson (or dGPU) with DeepStream installed, the pyds Python
  # bindings, and an engine built ON THIS DEVICE with trtexec. Choose option 5
  # in scripts/install.sh to set the dependencies up.
  #
  # To run TrafficCamNet, DashCamNet or FaceDetect instead, change path,
  # ds_infer_config, classes and input_size — no code changes.

  - id: peoplenet
    name: "NVIDIA PeopleNet — DeepStream + NvDCF"
    version: "2.6.1"
    path: "./models/peoplenet_fp16.engine"
    runtime: deepstream
    accelerator: cuda
    ds_infer_config: "config/deepstream_infer.txt"
    classes:
      - person
      - bag
      - face
    confidence_threshold: 0.4
    iou_threshold: 0.45     # applied by nvinfer's clustering, not here
    input_size: [960, 544]  # PeopleNet's fixed input — must match infer-dims
    use_tracker: true       # false = detection only, no nvtracker built at all
    tracker: "config/nvdcf_tracker.yml"
    half: false             # precision is fixed when the engine is built
